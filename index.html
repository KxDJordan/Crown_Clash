<style>
/* Layout: full-screen map with a slim status bar on top, command bar below, slate panels with hard pixel edges. */
:root{color-scheme:dark;
 --bg:#0e1019;--panel:#1b2030;--panel2:#252b40;--inset:#12151f;--edge:#4c5578;--edge2:#333a56;--hi:#6e7aa6;
 --gold:#ffcf5c;--text:#f4eedc;--dim:#a3a9c2;--red:#f0625a;--blue:#62a8ff;--green:#6ad67e;
 --fd:'Silkscreen','Jersey 15',monospace;--fb:'Jersey 15','VT323',monospace;
 --sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--sb:env(safe-area-inset-bottom,0px);
 --frame:inset 0 0 0 2px var(--edge),inset 0 0 0 4px #0c0e16,0 5px 0 #0009}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--fb);font-size:18px;line-height:1.15;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-font-smoothing:none;font-smooth:never}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
b{font-weight:400;color:var(--text)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:var(--inset)}::-webkit-scrollbar-thumb{background:var(--edge);border:2px solid var(--inset)}
#world{position:fixed;inset:0;width:100%;height:100%}
/* buttons */
.btn{font-family:var(--fb);font-size:18px;line-height:1;background:#3a4263;color:var(--text);border:2px solid #0c0e16;padding:7px 12px 6px;cursor:pointer;border-radius:0;box-shadow:inset 0 2px 0 #5a6591,inset 0 -3px 0 #272d47;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:32px}
.btn:hover{background:#464f76}.btn:active{transform:translateY(2px);box-shadow:inset 0 2px 0 #272d47}
.btn:focus-visible,.fcell:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.btn:disabled{opacity:.42;cursor:default;transform:none;background:#3a4263}
.btn.gold{background:#d99a22;color:#2a1a02;box-shadow:inset 0 2px 0 #ffd676,inset 0 -3px 0 #9a6710}.btn.gold:hover{background:#eaab30}
.btn.red{background:#b8403a;box-shadow:inset 0 2px 0 #e9776f,inset 0 -3px 0 #7c2622}.btn.red:hover{background:#c94c45}
.btn.blue{background:#3a6fc4;box-shadow:inset 0 2px 0 #7fb0ff,inset 0 -3px 0 #254a88}.btn.blue:hover{background:#467cd4}
.btn.sm{font-size:16px;padding:4px 8px 3px;min-height:26px}
.btn.on{background:#56618f;box-shadow:inset 0 0 0 2px var(--gold)}
/* top status bar */
#hud{position:fixed;top:0;left:0;right:0;display:none;gap:8px;align-items:center;padding:6px 10px;background:var(--panel);border-bottom:2px solid #0c0e16;box-shadow:inset 0 -2px 0 var(--edge2),0 3px 0 #0006;z-index:5;flex-wrap:wrap;font-size:18px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px 2px;background:var(--inset);border:2px solid var(--edge2);white-space:nowrap;min-height:26px}
.chip b{color:var(--gold)}
.xpbar{width:64px;height:8px;background:#06070c;border:2px solid #06070c;position:relative}
.xpbar i{position:absolute;left:0;top:0;bottom:0;background:var(--gold)}
/* bottom command bar */
#toolbar{position:fixed;bottom:0;left:0;right:0;display:none;gap:8px;justify-content:center;padding:8px;background:var(--panel);border-top:2px solid #0c0e16;box-shadow:inset 0 2px 0 var(--edge2);z-index:5;flex-wrap:wrap}
#toolbar .btn{min-width:104px;min-height:38px;font-size:19px}#bEnd{min-width:128px}
.xbtn{position:sticky;float:right;top:0;z-index:2;width:34px;height:34px;min-height:0;padding:0;margin:-4px -4px 6px 10px}
/* side panel */
#panel{position:fixed;right:10px;top:54px;width:372px;max-height:calc(100vh - 128px);overflow:auto;background:var(--panel);border:2px solid #0c0e16;box-shadow:var(--frame);padding:14px;z-index:6;display:none;font-size:18px;touch-action:pan-y}
.ph{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.ph canvas{width:64px;height:64px;border:2px solid #0c0e16;box-shadow:0 0 0 2px var(--edge);background:#000;margin:2px}
.ph .nm{font-family:var(--fd);font-size:15px;color:var(--gold);line-height:1.2}
.sub{color:var(--dim);font-size:16px;line-height:1.15}.sub b{color:var(--text)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.stats div{background:var(--inset);border:2px solid var(--edge2);padding:5px 3px 3px;text-align:center;font-size:14px;color:var(--dim);letter-spacing:1px}
.stats div b{display:block;font-size:24px;line-height:1;color:var(--text);letter-spacing:0}
.sq{display:flex;align-items:center;gap:8px;padding:4px 6px;background:var(--inset);margin:4px 0;border:2px solid var(--edge2)}
.sq .t{width:84px;font-size:17px}
.hp{flex:1;height:10px;background:#06070c;border:2px solid #06070c;position:relative}
.hp i{position:absolute;left:0;top:0;bottom:0;background:var(--green);box-shadow:inset 0 -2px 0 #3e9a52}
.hp i.low{background:#f09a48;box-shadow:inset 0 -2px 0 #b8601e}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
h3{margin:0 0 12px;color:var(--gold);font-family:var(--fd);font-size:18px;font-weight:400;line-height:1.2;text-wrap:balance}
h4{margin:16px 0 6px;color:var(--dim);font-family:var(--fd);font-size:11px;font-weight:400;letter-spacing:1px;text-transform:uppercase;border-bottom:2px solid var(--edge2);padding-bottom:4px}
/* dialogs */
#modal{position:fixed;inset:0;background:#080a12cc;display:none;align-items:center;justify-content:center;z-index:25;padding:12px}
#modal .box{background:var(--panel);border:2px solid #0c0e16;box-shadow:var(--frame);max-width:min(920px,100%);max-height:94vh;overflow:auto;padding:20px;min-width:min(340px,100%);touch-action:pan-y;font-size:18px}
#modal .box>p{margin:0 0 10px;max-width:70ch}
table{border-collapse:collapse;width:100%;font-size:18px;font-variant-numeric:tabular-nums}td,th{padding:5px 8px 4px;border-bottom:2px solid var(--edge2);text-align:left}
th{color:var(--dim);font-weight:400;font-size:15px;letter-spacing:1px;text-transform:uppercase}tr:last-child td{border-bottom:none}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.card{background:var(--panel2);border:2px solid var(--edge2);padding:10px}
.stars{color:var(--gold);letter-spacing:1px}
.tech{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.tc{background:var(--inset);border:2px solid var(--edge2);padding:9px;font-size:16px;color:var(--dim);display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.tc.have{border-color:var(--green);background:#16301f}.tc.avail{border-color:var(--gold)}.tc.lock{opacity:.55}
.tc b{font-size:19px;display:block;color:var(--text)}
/* battle set-up */
#battle{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;flex-direction:column}
#tachud{display:flex;gap:8px;align-items:center;padding:6px 10px;background:var(--panel);border-bottom:2px solid #0c0e16;box-shadow:inset 0 -2px 0 var(--edge2);flex-wrap:wrap;font-size:18px}
#tacwrap{flex:1;display:flex;justify-content:center;overflow:auto;position:relative;min-height:0;background-size:cover;background-position:center bottom;image-rendering:pixelated;touch-action:pan-y}
#bfield{display:flex;gap:12px;width:min(1040px,100%);padding:16px;align-items:flex-start}
.bcol{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.bvs{align-self:center;font-family:var(--fd);font-size:30px;color:var(--gold);text-shadow:3px 3px 0 #0c0e16}
.grp{background:#0e1019bb;border:2px solid var(--edge2);padding:4px}
.uc{display:flex;gap:6px;align-items:center;padding:3px 5px;border:2px solid transparent;background:var(--panel);margin:3px 0;cursor:pointer;font-size:16px}
.uc.gen{border-color:var(--edge);background:var(--panel2)}.uc.sel{border-color:var(--gold)}.uc.tgt{border-color:var(--red)}
.uc.dead{opacity:.35;filter:grayscale(1);cursor:default}.uc .ic canvas{width:52px;height:48px;display:block}.uc .ord{font-size:14px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tacbar{display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--panel);border-top:2px solid #0c0e16;box-shadow:inset 0 2px 0 var(--edge2);flex-wrap:wrap;min-height:54px;font-size:17px}
#tacinfo{flex:1;min-width:200px;display:flex;gap:8px;align-items:center}
#tacbtns .btn{min-height:38px}#tbFight{min-width:120px}
#rot{position:absolute;inset:auto 0 8px 0;text-align:center;color:var(--gold);font-size:16px;pointer-events:none;display:none}@media (orientation:portrait) and (max-width:760px){#rot{display:block}}
#phase{position:absolute;left:0;right:0;top:40%;text-align:center;font-family:var(--fd);font-size:30px;letter-spacing:3px;pointer-events:none;text-shadow:3px 3px 0 #000;opacity:0;transition:opacity .25s}
.gcard{background:#1b2030f2;border:2px solid;box-shadow:0 0 0 2px #0c0e16,0 6px 0 #0007;padding:12px;display:flex;flex-direction:column;gap:8px;margin:2px}
.gcard .nm{font-size:14px!important}
.troops{display:flex;flex-wrap:wrap;gap:3px}.tq{display:inline-flex;align-items:flex-end;background:var(--inset);border:2px solid var(--edge2);padding:1px 3px}
.tq canvas{width:18px;height:21px}.tq i{font-style:normal;font-size:14px;margin-left:1px}
.abl{display:flex;gap:6px;flex-wrap:wrap}
.formw{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.form{display:grid;grid-template-columns:repeat(2,62px);gap:4px}
.form .fh{font-size:14px;color:var(--dim);text-align:center;line-height:1;letter-spacing:1px;text-transform:uppercase}
.fcell{height:44px;background:var(--inset);border:2px solid var(--edge2);border-radius:0;display:flex;align-items:flex-end;justify-content:center;gap:1px;padding:1px;color:var(--text);font:inherit;font-size:15px;position:relative;overflow:hidden}
.fcell canvas{width:48px;height:40px;image-rendering:pixelated}.fcell.gen{border-color:var(--gold);background:#3b3220}.fcell.sel{border-color:var(--gold);background:#4a5380}
.fcell.mine{cursor:pointer}.fcell.mine:hover{border-color:var(--hi)}.fcell i{font-style:normal;position:absolute;right:3px;top:1px;font-size:15px;line-height:1;text-shadow:1px 1px 0 #000}.fcell.empty{color:var(--edge)}
/* battle scene overlay */
#scene{position:fixed;inset:0;z-index:30;background:#000;display:none;align-items:center;justify-content:center}
#scenebox{position:relative;width:min(100vw,177.7vh);aspect-ratio:16/9}
#scenecv{width:100%;height:100%}
.sbar{position:absolute;top:2%;width:44%;background:#1b2030ee;border:2px solid;box-shadow:0 0 0 2px #0c0e16,0 4px 0 #0007;padding:5px 10px 4px;font-size:clamp(12px,1.9vw,20px);display:flex;justify-content:space-between;align-items:center;gap:8px}
.sbar .big{font-size:clamp(20px,3.4vw,38px);line-height:1}
#sbL{left:2%}#sbR{right:2%;flex-direction:row-reverse;text-align:right}
#sround{position:absolute;bottom:3%;left:2%;font-size:clamp(12px,1.6vw,18px);color:var(--text);background:#1b2030dd;border:2px solid #0c0e16;padding:3px 10px 2px}
#sskipall{position:absolute;bottom:calc(3% + 34px);right:2%}
#sskip{position:absolute;bottom:3%;right:2%;font-size:clamp(12px,1.5vw,16px);color:#f4eedccc;background:#1b203099;padding:3px 10px 2px}
#sban{position:absolute;top:22%;left:0;right:0;pointer-events:none}
#sban .sb{position:absolute;font-family:var(--fd);font-size:clamp(14px,2.6vw,28px);color:var(--gold);text-shadow:3px 3px 0 #0c0e16;background:#1b2030cc;border:2px solid #0c0e16;padding:6px 18px;animation:tin .3s}
#sban .l{left:4%}#sban .r{right:4%}
/* title */
#title{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:radial-gradient(#0e101966 20%,#0e1019e6);padding:16px}
#title .tb{background:var(--panel);border:2px solid #0c0e16;box-shadow:var(--frame);padding:32px 36px 26px;text-align:center;max-width:100%}
#title h1{margin:0;font-family:var(--fd);font-weight:700;font-size:clamp(28px,6vw,54px);line-height:1.05;color:var(--gold);letter-spacing:2px;text-shadow:0 4px 0 #9a6710,0 8px 0 #0c0e16}
#title h1 .amp{font-family:var(--fb);font-weight:400;font-size:1.25em;line-height:.8;color:var(--text);text-shadow:0 4px 0 #0c0e16}
#title p{color:var(--dim);margin:18px 0 18px;font-size:20px}#title p.sub{font-size:16px;margin:14px 0 0}
#title .btn{min-height:40px;font-size:20px;padding:8px 16px 7px}
input[type=text]{font-family:var(--fb);font-size:20px;background:var(--inset);color:var(--text);border:2px solid var(--edge);border-radius:0;padding:7px 10px 6px;width:260px;text-align:center}
/* notices */
#toasts{position:fixed;top:62px;left:50%;transform:translateX(-50%);z-index:28;pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:center;width:max-content;max-width:92vw}
.toast{background:var(--panel);border:2px solid #0c0e16;box-shadow:inset 0 0 0 2px var(--gold),0 4px 0 #0008;padding:9px 16px 8px;font-size:18px;animation:tin .25s ease-out;text-align:center}
@keyframes tin{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.toast,#sban .sb{animation:none}}
#log{position:fixed;left:10px;bottom:calc(var(--tbh,56px) + 6px);z-index:4;font-size:16px;color:var(--text);pointer-events:none;max-width:46vw;display:none}
#log div{background:#12151fcc;padding:2px 8px 1px;margin-top:2px;width:max-content;max-width:100%}
#zoom{position:fixed;left:10px;top:calc(var(--hudh,50px) + 8px);z-index:5;display:none;flex-direction:column;gap:4px}
#zoom .btn{width:32px;height:32px;padding:0}
#busy{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);z-index:7;background:var(--panel);border:2px solid #0c0e16;box-shadow:inset 0 0 0 2px var(--edge);padding:7px 16px 6px;display:none;font-size:18px}
.pill{display:inline-block;padding:1px 7px 0;font-size:15px;background:var(--inset);border:2px solid var(--edge2)}
.sw{display:inline-block;width:10px;height:10px;border:2px solid #0c0e16;vertical-align:middle;margin-right:4px;box-sizing:content-box}
#rotate{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px}
#rotate .ic{font-size:60px;animation:rot 2s infinite}@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
@media (orientation:portrait) and (max-width:760px) and (pointer:coarse){body:not(.anyway) #rotate{display:flex}}
/* ===== phone portrait ===== */
@media (max-width:760px) and (orientation:portrait){
 #panel{left:6px;right:6px;width:auto;top:auto;bottom:var(--tbh,56px);max-height:42vh;padding:10px}
 #toolbar{gap:5px;padding:6px}#toolbar .lb{display:none}#toolbar .btn{font-size:20px;padding:6px 12px;min-width:0}#bEnd{min-width:0}
 #hud{font-size:15px;gap:5px;padding:4px 6px}.chip{padding:2px 6px 1px;min-height:22px}
 #tacbar{font-size:15px}#tacbtns .btn{font-size:16px;padding:4px 8px}
 .bvs{display:none}#bfield{gap:6px;padding:6px;flex-direction:column}.gcard{padding:8px}
 #title .tb{padding:22px 16px}input[type=text]{width:100%}
}
/* ===== touch: finger-sized controls ===== */
@media (pointer:coarse){
 .btn{min-height:40px}.btn.sm{min-height:36px;padding:5px 10px 4px}.xbtn{width:38px;height:38px}
 #zoom .btn{width:42px;height:42px;font-size:22px}.fcell{height:46px}
}
/* ===== phone landscape (the primary layout): status strip on top, command rail on the right, detail drawer beside it ===== */
@media (orientation:landscape) and (max-height:520px){
 html,body{font-size:16px}
 #hud{font-size:16px;padding:4px 8px 4px calc(8px + var(--sl));gap:5px;flex-wrap:nowrap;overflow-x:auto;right:calc(72px + var(--sr));scrollbar-width:none}
 #hud::-webkit-scrollbar{display:none}
 #hud .chip{padding:1px 7px 0;min-height:24px;gap:4px;flex:none}#hud .chip:first-child b{max-width:130px;overflow:hidden;text-overflow:ellipsis}
 .xpbar{width:40px}
 #toolbar{top:0;bottom:0;left:auto;right:0;width:calc(72px + var(--sr));flex-direction:column;justify-content:space-between;flex-wrap:nowrap;padding:5px calc(5px + var(--sr)) calc(5px + var(--sb)) 5px;border-top:none;border-left:2px solid #0c0e16;box-shadow:inset 2px 0 0 var(--edge2);gap:4px}
 #toolbar .btn{flex:1;flex-direction:column;gap:1px;width:100%;min-width:0;min-height:0;padding:2px 0 1px;white-space:nowrap}
 #toolbar .btn .ic{font-size:19px;line-height:1.1}#toolbar .btn .lb{font-size:13px;line-height:1;letter-spacing:0}
 #bEnd{flex:1.5!important;min-width:0}
 #panel{right:calc(78px + var(--sr));left:auto;top:var(--hudh,36px);bottom:calc(6px + var(--sb));width:min(330px,44vw);max-height:none;font-size:16px;padding:10px}
 #panel h3{font-size:14px;margin:0 0 6px}.ph{gap:8px;margin-bottom:6px}.ph canvas{width:44px;height:44px}.ph .nm{font-size:12px}
 .stats{gap:4px;margin:6px 0}.stats div{padding:3px 2px 1px;font-size:12px}.stats div b{font-size:20px}
 .sub{font-size:14px}h4{margin:10px 0 4px;font-size:10px}.sq{padding:2px 5px;margin:3px 0;gap:6px}.sq .t{width:70px;font-size:15px}
 .btn{font-size:16px;padding:5px 10px 4px}.btn.sm{font-size:15px}.row{gap:5px;margin-top:6px}
 #zoom{top:var(--hudh,36px);left:calc(8px + var(--sl))}
 #log{left:calc(8px + var(--sl));bottom:calc(4px + var(--sb));max-width:38vw;font-size:14px}#busy{bottom:calc(8px + var(--sb))}#toasts{top:36px;max-width:70vw}.toast{font-size:15px;padding:5px 12px 4px}
 #modal{padding:6px calc(6px + var(--sr)) calc(6px + var(--sb)) calc(6px + var(--sl))}
 #modal .box{padding:12px 14px;width:min(820px,100%);max-width:100%;max-height:100%;font-size:16px}
 #modal .box:has(> h3:first-child){width:auto;min-width:min(380px,100%)}
 h3{font-size:15px;margin-bottom:8px}table{font-size:16px}td,th{padding:4px 6px 3px}th{font-size:13px}
 .cards{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}.card{padding:8px}
 .tech{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}.tc{padding:7px;font-size:14px;gap:3px}.tc b{font-size:17px}
 #title{padding:8px}#title .tb{padding:16px 24px 14px}#title h1{font-size:clamp(24px,5.4vw,34px)}#title p{margin:10px 0 10px;font-size:17px}#title p.sub{font-size:14px;margin-top:8px}#title .btn{min-height:42px;font-size:18px}
 input[type=text]{font-size:18px;padding:6px 10px 5px}
 #tachud{font-size:15px;padding:3px calc(8px + var(--sr)) 3px calc(8px + var(--sl));flex-wrap:nowrap;overflow:hidden;white-space:nowrap;gap:5px}#tachud .chip{min-height:22px;padding:1px 7px 0;flex:none}#tachud .sub{overflow:hidden;text-overflow:ellipsis}
 #tacbar{min-height:0;padding:5px calc(8px + var(--sr)) calc(5px + var(--sb)) calc(8px + var(--sl));font-size:14px;flex-wrap:nowrap}#tacinfo{min-width:0}#tacinfo .sub{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
 #tacbtns{flex-wrap:nowrap}#tacbtns .btn{min-height:42px;font-size:17px}#tbFight{min-width:130px}
 #bfield{padding:6px calc(8px + var(--sr)) 6px calc(8px + var(--sl));gap:8px}.bvs{display:none}.bcol{gap:6px}
 .gcard{padding:8px;gap:5px}.gcard .nm{font-size:12px!important}.gcard .ph canvas{width:40px;height:40px}
 .formw{gap:8px}.form{grid-template-columns:repeat(2,56px);gap:3px}.fcell{height:40px}.fcell canvas{width:43px;height:36px}.form .fh{font-size:12px}
 .sbar{padding:3px 8px 2px}#sskipall{bottom:calc(3% + 30px);min-height:38px}
}

// ============ SPRITE-SHEET SOLDIERS (battle scene) ============
// 100px cells, feet on y=57. Each entry is [row, frameCount].
const UDEF = {
  archer: { ox: 49, idle: [0, 6], run: [1, 8], atk: [[2, 9], [3, 12]], hurt: [4, 4], dead: [5, 4] },
  infantry: { ox: 49, idle: [0, 6], run: [1, 8], atk: [[2, 6], [3, 6]], hurt: [5, 4], dead: [6, 4] },
  knight: { ox: 49, idle: [0, 6], run: [1, 8], atk: [[2, 7], [3, 10]], sp: [4, 11], hurt: [6, 4], dead: [7, 4] },
  cavalry: { ox: 50, w: 19, idle: [0, 6], run: [1, 8], charge: [2, 8], atk: [[3, 6], [4, 9]], sp: [5, 8], hurt: [6, 4], dead: [7, 4] },
  axe: { ox: 52, idle: [0, 6], run: [1, 8], atk: [[2, 9], [3, 9]], sp: [4, 12], hurt: [5, 4], dead: [6, 4] },
};
const UNITS = {};
for (const k in UNIT_SRC) {
  const im = new Image(), U = UNITS[k] = { ok: false };
  im.onload = () => { const [c, x] = mkCanvas(im.width, im.height); x.translate(im.width, 0); x.scale(-1, 1); x.drawImage(im, 0, 0); U.img = im; U.flip = c; U.W = im.width; U.ok = true; };
  im.src = UNIT_SRC[k];
}
const unitSheet = (type, gen) => type === 'archer' ? 'archer' : type === 'cavalry' ? 'cavalry' : type === 'spear' ? 'axe' : type === 'infantry' ? (gen ? 'knight' : 'infantry') : null;
// o: drawSoldier fields + dt (secs since death), hurt (secs since hit), ak (0..1 one-shot attack progress), sp (use special), charge
function drawUnit(ctx, o) {
  const k = unitSheet(o.type, o.gen), U = UNITS[k]; if (!U || !U.ok) return false;
  const d = UDEF[k], t = o.t || 0, x = Math.round(o.x), y = Math.round(o.y);
  let row, n, fr;
  if (o.state === 'dead') { [row, n] = d.dead; fr = Math.min(n - 1, Math.floor((o.dt || 0) * 9)); }
  else if (o.hurt != null) { [row, n] = d.hurt; fr = Math.min(n - 1, Math.floor(o.hurt * 10)); }
  else if (o.state === 'atk') {
    if (o.ak != null) { [row, n] = (o.sp && d.sp) || d.atk[o.av ? 1 : 0]; fr = Math.min(n - 1, Math.floor(clamp(o.ak, 0, 1) * n)); }
    else { const a = d.atk, f = Math.floor(t * 11) % (a[0][1] + a[1][1]); if (f < a[0][1]) { row = a[0][0]; fr = f; } else { row = a[1][0]; fr = f - a[0][1]; } }
  }
  else if (o.state === 'run') { [row, n] = (o.charge && d.charge) || d.run; fr = Math.floor(t * 11) % n; }
  else { [row, n] = d.idle; fr = Math.floor(t * 7) % n; }
  ctx.globalAlpha = o.alpha == null ? 1 : o.alpha;
  if (o.state !== 'dead') { const w = d.w || 11; ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.fillRect(x - (w >> 1) - 1, y - 1, w + 2, 2); ctx.fillStyle = o.pal.light; ctx.fillRect(x - (w >> 1), y, w, 1); }
  if (o.facing >= 0) ctx.drawImage(U.img, fr * 100, row * 100, 100, 100, x - d.ox, y - 57, 100, 100);
  else ctx.drawImage(U.flip, U.W - (fr + 1) * 100, row * 100, 100, 100, x - (99 - d.ox), y - 57, 100, 100);
  ctx.globalAlpha = 1; return true;
}

// mini figures for squads on tactical map
function miniFig(ctx, x, y, type, pal, fc, f) {
  const P = (dx, dy, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(fc > 0 ? x + dx : x - dx - w + 1, y + dy, w, h); };
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.fillRect(x - 2, y, 6, 1);
  if (type === 'cavalry') {
    P(-3, -2, 1, 2, '#3a2a22'); P(3, -2, 1, 2, '#3a2a22');
    P(-3, -5, 7, 3, HORSE[0]); P(4, -7, 2, 3, HORSE[0]); P(5, -7, 2, 1, HORSE[0]); P(-4, -5, 1, 2, '#2a1a10');
    P(-1, -9, 3, 4, pal.main); P(-1, -11, 2, 2, SKINS[1]); P(-1, -12, 2, 1, STEEL);
    P(-2, -8, 10, 1, WOOD); P(8, -8, 1, 1, STEEL);
    return;
  }
  const lg = f % 2;
  P(-1, -2, 1, 2, PANTS); P(1, -2 + lg * 0, 1, 2, PANTS);
  if (type === 'mage') { P(-2, -7, 5, 6, pal.main); P(-1, -9, 3, 2, SKINS[1]); P(-2, -10, 5, 1, pal.deep); P(-1, -12, 3, 2, pal.deep); P(3, -10, 1, 10, WOOD); P(3, -11, 1, 1, '#7ee8ff'); return; }
  P(-2, -6, 4, 4, pal.main); P(-2, -6, 1, 4, pal.dark);
  P(-1, -9, 3, 3, SKINS[1]);
  if (type === 'archer') { P(-1, -10, 3, 1, pal.deep); P(-2, -9, 1, 2, pal.deep); P(3, -8, 1, 1, WOOD); P(4, -7, 1, 3, WOOD); P(3, -4, 1, 1, WOOD); }
  else if (type === 'spear') { P(-1, -10, 3, 1, STEEL); P(3, -12, 1, 12, WOOD); P(3, -13, 1, 1, STEEL); P(-3, -6, 1, 3, pal.deep); }
  else { P(-1, -10, 3, 1, STEEL); P(3, -9, 1, 4, STEEL); P(3, -5, 1, 1, '#6a4a20'); P(-3, -6, 2, 3, pal.deep); P(-3, -5, 2, 1, GOLD); }
}

function drawBanner(ctx, x, y, pal, t, crown) {
  ctx.fillStyle = '#4a3420'; ctx.fillRect(x, y - 14, 1, 14);
  const w = Math.round(Math.sin(t * 5 + x) * 1);
  ctx.fillStyle = pal.main; ctx.fillRect(x + 1, y - 14, 5, 3); ctx.fillRect(x + 1, y - 11, 4 + w, 1);
  ctx.fillStyle = pal.light; ctx.fillRect(x + 2, y - 13, 2, 1);
  if (crown) { ctx.fillStyle = GOLD; ctx.fillRect(x, y - 15, 1, 1); }
}

// 3x5 digits
const DIG = ['111101101101111', '010110010010111', '111001111100111', '111001111001111', '101101111001001', '111100111001111', '111100111101111', '111001001010010', '111101111101111', '111101111001111'];
function drawNum(ctx, n, x, y, col = '#fff', bg = '#000') {
  const s = String(n);
  ctx.fillStyle = bg; ctx.fillRect(x - 1, y - 1, s.length * 4 + 1, 7);
  for (let k = 0; k < s.length; k++) { const d = DIG[+s[k]]; ctx.fillStyle = col; for (let p = 0; p < 15; p++) if (d[p] === '1') ctx.fillRect(x + k * 4 + (p % 3), y + ((p / 3) | 0), 1, 1); }
}

// ============ CITY SPRITES ============
const cityCache = new Map();
function citySprite(owner, level, capital) {
  const key = owner + ':' + level + ':' + capital;
  if (cityCache.has(key)) return cityCache.get(key);
  const pal = G.pals[owner];
  const [cv, cx] = mkCanvas(28, 28);
  const P = (x, y, w, h, c) => { cx.fillStyle = c; cx.fillRect(x, y, w, h); };
  const stone = '#a49e94', stoneL = '#c8c2b6', stoneD = '#6e6860', ol = '#2e2a26';
  const house = (x, y, roof) => { P(x - 1, y - 6, 7, 1, ol); P(x, y - 7, 5, 1, ol); P(x - 1, y - 5, 7, 1, roof); P(x, y - 6, 5, 1, roof); P(x + 1, y - 7, 3, 1, roof); P(x, y - 4, 5, 4, '#e0d0a8'); P(x, y - 4, 1, 4, '#b8a880'); P(x + 2, y - 2, 1, 2, '#5a3a20'); P(x - 1, y, 7, 1, ol); };
  if (level <= 1) {
    house(4, 20, pal.main); house(14, 17, pal.dark); house(11, 24, pal.main);
    for (let x = 1; x < 27; x += 2) { P(x, 22, 1, 4, '#6a4a28'); } P(1, 24, 26, 1, '#8a6a38');
  } else {
    const big = level >= 4;
    const wy = big ? 13 : 15, wh = big ? 11 : 9, wx = big ? 2 : 4, ww = big ? 24 : 20;
    // walls
    P(wx, wy, ww, wh, stone); P(wx, wy, ww, 1, stoneL); P(wx, wy + wh - 1, ww, 1, stoneD);
    for (let x = wx; x < wx + ww; x += 2) P(x, wy - 1, 1, 1, stone);
    for (let yy = wy + 3; yy < wy + wh; yy += 3) for (let x = wx + ((yy / 3) % 2) * 2; x < wx + ww; x += 4) P(x, yy, 3, 1, stoneD);
    P(wx - 1, wy - 1, 1, wh + 1, ol); P(wx + ww, wy - 1, 1, wh + 1, ol); P(wx - 1, wy + wh, ww + 2, 1, ol);
    // gate
    P(12, wy + wh - 5, 4, 5, '#2a1c12'); P(13, wy + wh - 6, 2, 1, '#2a1c12'); P(12, wy + wh - 5, 4, 1, '#4a3420');
    // towers
    const tower = (x, top, h) => { P(x, top, 5, h, stone); P(x, top, 1, h, stoneL); P(x + 4, top, 1, h, stoneD); P(x - 1, top - 1, 7, 1, ol); P(x, top - 2, 5, 1, pal.dark); P(x + 1, top - 3, 3, 1, pal.main); P(x + 2, top - 4, 1, 1, pal.main); P(x + 2, top + 3, 1, 2, '#2a1c12'); P(x - 1, top, 1, h, ol); P(x + 5, top, 1, h, ol); };
    tower(wx - 2, wy - 4, wh + 4); tower(wx + ww - 3, wy - 4, wh + 4);
    // keep
    const kh = big ? 14 : 10, kx = 10, ky = wy - kh + 4;
    P(kx, ky, 8, kh, stoneL); P(kx + 6, ky, 2, kh, stone); P(kx - 1, ky, 1, kh, ol); P(kx + 8, ky, 1, kh, ol);
    P(kx - 1, ky - 1, 10, 1, ol); P(kx, ky - 2, 8, 1, capital ? GOLD : pal.dark); P(kx + 1, ky - 3, 6, 1, pal.main); P(kx + 2, ky - 4, 4, 1, pal.main); P(kx + 3, ky - 5, 2, 1, pal.light);
    P(kx + 2, ky + 3, 1, 2, '#2a1c12'); P(kx + 5, ky + 3, 1, 2, '#2a1c12');
    if (level >= 3) { P(kx + 3, ky + 7, 2, 2, '#ffd870'); }
    if (big) { tower(wx + 5, wy - 2, wh + 2); }
  }
  cityCache.set(key, cv); return cv;
}

// ============ PORTRAITS ============
const portCache = new Map();
function portrait(g) {
  const key = g.id + ':' + g.faction;
  if (portCache.has(key)) return portCache.get(key);
  const rr = mulberry32(g.pseed || 1), rp = a => a[Math.floor(rr() * a.length)];
  const pal = G.pals[g.faction] || G.pals[NEUTRAL];
  const [cv, cx] = mkCanvas(32, 32);
  const P = (x, y, w, h, c) => { cx.fillStyle = c; cx.fillRect(x, y, w, h); };
  for (let y = 0; y < 32; y++) { P(0, y, 32, 1, rgb(mix(pal.c, [10, 8, 6], 0.55 + y / 32 * 0.35))); }
  const skin = rp(SKINS), hair = rp(HAIRS), fem = rr() < 0.35, beard = !fem && rr() < 0.45;
  const sd = rgb(hex(skin), 0.82);

async function playBattle(scenes) {

  for (const e of evs) if (!e.buff && !SKIP.round) {
    $('#sround').textContent = `${e.caster.g.name.split(' ')[0]} unleashes ${ABIL[e.k].n}`;
    await playScene(buildScene(b, { skill: true, caster: e.caster, k: e.k, before: e.before }, [{ side: lr(e.caster.side), text: `${ABIL[e.k].i} ${ABIL[e.k].n}!` }]));
  }

      if (!SKIP.round) {
        const bn = []; for (const g of [x, y]) if (pendingBan.has(g.uid)) { bn.push(pendingBan.get(g.uid)); pendingBan.delete(g.uid); }
        $('#sround').textContent = `Round ${b.round}/${b.maxRounds}`;
        await playScene(buildScene(b, info, bn));
      }
      for (const g of info.falls) toast(`⚑ ${g.g.name} has fallen! ${g.side === b.player ? 'Your' : 'Enemy'} troops flee.`);

}

  $('#mbox').innerHTML = `<h3 style="font-size:26px;color:${won ? 'var(--gold)' : 'var(--red)'}">${won ? 'VICTORY' : 'DEFEAT'}</h3>
   <p class="sub">${b.timeout ? (b.player === 0 ? 'The defenders held — your attack stalls.' : 'You held — the attackers withdraw.') : won ? 'The enemy commanders are broken.' : 'Your commanders have fallen.'}</p>
   <table><tr><th>General</th><th>Status</th><th>XP</th></tr>${rows}</table><div class="row" style="margin-top:10px"><button class="btn gold" id="bwc">Continue</button></div>`;
  $('#modal').style.display = 'flex';

function armyPanel(g) {
  const P = $('#panel'); P.style.display = 'block';
  const own = g.faction === 0, F = G.factions[g.faction];
  const xpP = Math.round(g.xp / xpNeed(g.lvl) * 100);
  let h = `<div class="ph"><span id="pport"></span><div><div class="nm">${g.name}</div><div><span class="stars">${'★'.repeat(g.stars)}</span> ${g.cls} · Lv ${g.lvl}</div><div class="sub"><span class="sw" style="background:${F.col}"></span>${F.name}</div><div class="xpbar" style="width:120px;margin-top:3px"><i style="width:${xpP}%"></i></div></div></div>`;
  h += genStatsHTML(g);
  const abl = Object.keys(ABIL).filter(k => ABIL[k].cls === g.cls);
  h += `<h4>Abilities</h4>` + abl.map(k => `<div class="sub">${ABIL[k].i} <b style="color:${g.lvl >= ABIL[k].lv ? 'var(--text)' : '#777'}">${ABIL[k].n}</b>${g.lvl >= ABIL[k].lv ? '' : ' (Lv' + ABIL[k].lv + ')'} — ${ABIL[k].d}</div>`).join('') + (abilReady(g) ? '' : `<div class="sub" style="color:#f99">Recharging until turn ${g.cd}</div>`);
  h += `<h4>Squads ${g.squads.length}/${maxSquads(g)}</h4>` + (g.squads.length ? g.squads.map((s, k) => sqRow(s, k, g, own)).join('') : '<div class="sub">No squads — this general fights alone!</div>');
  if (own) {
    h += `<div class="sub" style="margin-top:6px">Movement left: <b>${g.mp}</b>/${worldMove(g)}${UI.targets.length ? ' · <span style="color:var(--red)">Red tiles can be attacked</span>' : ''}</div>`;
    if (canRefit(g)) {
      const rc = refillCost(g);
      h += `<div class="row"><button class="btn" id="pRefill" ${rc === 0 || rc > F.gold ? 'disabled' : ''}>♻ Refill all (${rc}g)</button></div>`;
      if (g.squads.length < maxSquads(g)) {
        h += `<h4>Train squad</h4><div class="row">` + Object.keys(TROOPS).map(t => troopUnlocked(0, t) ? `<button class="btn sm" data-train="${t}" ${trainCost(0, t) > F.gold ? 'disabled' : ''} title="${TROOPS[t].d}">${TROOPS[t].n} ${trainCost(0, t)}g</button>` : `<button class="btn sm" disabled title="Requires ${TECH[TROOPS[t].req].n}">🔒 ${TROOPS[t].n}</button>`).join('') + `</div>`;
      }
    } else h += `<div class="sub" style="margin-top:6px">⚠ Return to your territory to refill or train squads.</div>`;
  }
  const c = cityAt(g.x, g.y); if (c) h += `<div class="row"><button class="btn sm" id="pCity">View ${c.name}</button></div>`;
  P.innerHTML = h; $('#pport').appendChild(portraitImg(g, 64));
  const rb = $('#pRefill'); if (rb) rb.onclick = () => { const rc = refillCost(g); if (F.gold >= rc) { F.gold -= rc; g.squads.forEach(s => s.hp = 10); toast('Squads replenished.'); afterWorldChange(); } };
  P.querySelectorAll('[data-train]').forEach(b => b.onclick = () => { const t = b.dataset.train, cst = trainCost(0, t); if (F.gold < cst || g.squads.length >= maxSquads(g)) return; F.gold -= cst; g.squads.push({ type: t, hp: 10 }); afterWorldChange(); });
  P.querySelectorAll('[data-dis]').forEach(b => b.onclick = () => { g.squads.splice(+b.dataset.dis, 1); afterWorldChange(); });
  const pc = $('#pCity'); if (pc) pc.onclick = () => { UI.sel = null; UI.selCity = c; UI.reach = null; UI.targets = []; renderPanel(); };
}
function cityPanel(c) {
  const P = $('#panel'); P.style.display = 'block';
  const own = c.owner === 0, F = G.factions[c.owner];
  const rep = incomeReport(c.owner), row = rep.rows.find(r => r.c === c);
  let tiles = 0; for (let i = 0; i < G.N; i++) if (G.terr[i] === c.id) tiles++;
  let h = `<h3>${c.capital ? '♛ ' : ''}${c.name}</h3><div class="sub"><span class="sw" style="background:${F.col}"></span>${F.name} · Level ${c.level}/5 · ${tiles} tiles</div>
  <div class="stats"><div>Income<b>${row ? Math.round(row.val * rep.mult) : 0}</b></div><div>Garrison<b>${Math.round(c.garrison * 100)}%</b></div><div>Squads<b>${clamp(1 + c.level + (c.barracks ? 1 : 0), 1, 6)}</b></div><div>Walls<b>${c.walls ? '✔' : '—'}</b></div></div>`;
  h += `<h4>Buildings</h4>` + Object.keys(BUILD).map(k => `<div class="sq"><span class="t">${BUILD[k].n}</span><span class="sub" style="flex:1">${BUILD[k].d}</span>${c[k] ? '✔' : own ? `<button class="btn sm" data-b="${k}" ${buildCost(c, k) > F.gold ? 'disabled' : ''}>${buildCost(c, k)}g</button>` : '—'}</div>`).join('');
  if (own && c.level < 5) h += `<div class="row"><button class="btn gold" id="pUp" ${upCost(c) > F.gold ? 'disabled' : ''}>⬆ Upgrade to Lv ${c.level + 1} (${upCost(c)}g)</button></div><div class="sub">Higher levels grow territory, income and the castellan's garrison.</div>`;
  if (!own) h += `<div class="sub" style="margin-top:6px">Defended by a castellan with ${clamp(1 + c.level + (c.barracks ? 1 : 0), 1, 6)} squads at ${Math.round(c.garrison * 100)}% strength. Select an army and attack from an adjacent tile.</div>`;
  const a = armyAt(c.x, c.y); if (a) h += `<div class="row"><button class="btn sm" id="pArmy">View ${a.name}</button></div>`;
  P.innerHTML = h;
  P.querySelectorAll('[data-b]').forEach(b => b.onclick = () => { const k = b.dataset.b, cst = buildCost(c, k); if (F.gold < cst) return; F.gold -= cst; c[k] = true; cityCache.clear(); afterWorldChange(); });
  const up = $('#pUp'); if (up) up.onclick = () => { const cst = upCost(c); if (F.gold < cst) return; F.gold -= cst; c.level++; computeTerritory(); toast(`${c.name} grows to level ${c.level}!`); afterWorldChange(); };
  const pa = $('#pArmy'); if (pa) pa.onclick = () => selectArmy(a);
}

// ============ MODALS ============
function openModal(html) { $('#mbox').innerHTML = `<button class="btn sm xbtn" id="mX" aria-label="Close">✕</button>` + html + `<div class="row" style="margin-top:12px"><button class="btn" id="mClose">Close</button></div>`; $('#mbox').scrollTop = 0; $('#modal').style.display = 'flex'; $('#mClose').onclick = $('#mX').onclick = closeModal; }
// every side panel gets a close button in its corner
new MutationObserver(() => { const P = $('#panel'); if (!P.firstChild || P.querySelector('.xbtn')) return; const old = P.querySelector('#pX'); if (old) old.style.display = 'none'; const x = document.createElement('button'); x.className = 'btn sm xbtn'; x.textContent = '✕'; x.setAttribute('aria-label', 'Close'); x.onclick = deselect; P.insertBefore(x, P.firstChild); }).observe($('#panel'), { childList: true });
function closeModal() { $('#modal').style.display = 'none'; renderHUD(); renderPanel(); }
$('#modal').addEventListener('pointerdown', e => { if (e.target.id === 'modal' && $('#mClose')) closeModal(); });

function kingdomModal() {
  const F = G.factions[0], rep = incomeReport(0);
  let h = `<h3>🏰 ${F.name}</h3><div class="stats"><div>Kingdom Lv<b>${F.klv}</b></div><div>XP<b>${F.kxp}/${kneed(F.klv)}</b></div><div>Generals<b>${fGens(0).length}/${genCap(0)}</b></div><div>Territory<b>${rep.tilesOwned}</b></div></div>
  <div class="sub">Kingdom XP comes from battles (+30 win), captured cities (+80) and held territory each turn. Each level raises the general cap by 1 and grants a Tech Point.</div>
  <h4>Treasury</h4><table><tr><th>City</th><th>Lv</th><th>Gold</th></tr>${rep.rows.map(r => `<tr><td>${r.c.capital ? '♛ ' : ''}${r.c.name}</td><td>${r.c.level}</td><td>${r.val}</td></tr>`).join('')}
  <tr><td>Tech bonus</td><td></td><td>×${rep.mult.toFixed(2)}</td></tr><tr><td>Army upkeep</td><td></td><td style="color:var(--red)">-${rep.up}</td></tr><tr><th>Net per turn</th><th></th><th>${rep.net >= 0 ? '+' : ''}${rep.net}</th></tr></table>
  <h4>Realm standings</h4><table><tr><th>Kingdom</th><th>Lv</th><th>Cities</th><th>Generals</th><th>Status</th></tr>${G.factions.slice(0, 4).map(f => `<tr><td><span class="sw" style="background:${f.col}"></span>${f.name}</td><td>${f.klv}</td><td>${fCities(f.id).length}</td><td>${fGens(f.id).length}</td><td>${f.alive ? '' : '☠ Fallen'}</td></tr>`).join('')}
  <tr><td><span class="sw" style="background:${G.factions[4].col}"></span>Free Towns</td><td>—</td><td>${fCities(4).length}</td><td>—</td><td></td></tr></table>
  <h4>Chronicle</h4><div class="sub" style="max-height:120px;overflow:auto">${G.log.slice().reverse().map(s => `<div>${s}</div>`).join('') || 'Nothing yet.'}</div>
  <h4>Game</h4><div class="row"><button class="btn sm" id="kSave">💾 Save</button><button class="btn sm" id="kScn">🎬 Battle scenes: ${SET.scenes ? 'On' : 'Off'}</button><button class="btn sm red" id="kQuit">Abandon & new game</button></div>`;
  openModal(h);
  $('#kSave').onclick = () => { saveGame(); toast('Game saved.'); };
  $('#kScn').onclick = () => { SET.scenes = !SET.scenes; saveSet(); kingdomModal(); };
  $('#kQuit').onclick = () => { $('#kQuit').textContent = 'Click again to confirm'; $('#kQuit').onclick = () => { try { localStorage.removeItem(SAVE_KEY); } catch (e) { } location.reload(); }; };
}
function generalsModal() {
  const list = fGens(0);
  let h = `<h3>⚔ Your Generals (${list.length}/${genCap(0)})</h3><div class="cards">`;
  list.forEach(g => {
    h += `<div class="card"><div class="ph"><span data-p="${g.id}"></span><div><div class="nm" style="font-size:15px">${g.name}</div><div><span class="stars">${'★'.repeat(g.stars)}</span> ${g.cls} Lv${g.lvl}</div><div class="sub">${g.status === 'wounded' ? `🩹 Recovering (${g.wound} turns)` : `${g.squads.length}/${maxSquads(g)} squads · ${g.squads.reduce((a, s) => a + s.hp, 0)} men · MP ${g.mp}`}</div></div></div>
    <div class="sub">ATK ${g.atk} · DEF ${g.def} · LDR ${g.ldr} · CMD ${g.cmd}</div>${g.status === 'field' ? `<div class="row"><button class="btn sm" data-go="${g.id}">Go to</button></div>` : ''}</div>`;
  });
  h += `</div>`; openModal(h);
  list.forEach(g => { const s = $(`[data-p="${g.id}"]`); if (s) s.appendChild(portraitImg(g, 48)); });
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { const g = G.gens.find(x => x.id === +b.dataset.go); closeModal(); centerOn(g.x, g.y); selectArmy(g); });
}
const SCOUT_COST = 40;
function tavernModal() {
  const F = G.factions[0], full = fGens(0).length >= genCap(0);
  let h = `<h3>🍺 Tavern — Scout for Generals</h3><div class="sub">Pay scouts to find commanders for hire. Higher kingdom levels attract better (★) generals. Hired generals appear at your capital with one squad. ${full ? '<b style="color:var(--red)">General cap reached — raise your Kingdom level to command more.</b>' : ''}</div>
  <div class="row"><button class="btn gold" id="tScout" ${F.gold < SCOUT_COST ? 'disabled' : ''}>🔍 Scout (${SCOUT_COST}g)</button><span class="sub">Gold: ${F.gold}</span></div><div class="cards" style="margin-top:10px">`;
  F.scout.forEach((g, k) => {
    const cost = hireCost(g);
    h += `<div class="card"><div class="ph"><span data-sp="${k}"></span><div><div class="nm" style="font-size:15px">${g.name}</div><div><span class="stars">${'★'.repeat(g.stars)}</span> ${g.cls}</div></div></div>${genStatsHTML(g)}
    <div class="row"><button class="btn gold sm" data-hire="${k}" ${full || F.gold < cost ? 'disabled' : ''}>Hire ${cost}g</button><span class="sub">Upkeep ~${upkeep(g) + 2}/turn</span></div></div>`;
  });
  h += `</div>`; openModal(h);
  F.scout.forEach((g, k) => { const s = $(`[data-sp="${k}"]`); if (s) s.appendChild(portraitImg(g, 56)); });
  $('#tScout').onclick = () => {
    if (F.gold < SCOUT_COST) return; F.gold -= SCOUT_COST;
    F.scout = [0, 1, 2].map(() => makeGeneral(0, clamp(1 + Math.floor(R() * 2.2 + R() * F.klv * 0.35), 1, 5)));
    tavernModal(); renderHUD();
  };
  document.querySelectorAll('[data-hire]').forEach(b => b.onclick = () => {
    const g = F.scout[+b.dataset.hire], cost = hireCost(g); if (F.gold < cost || fGens(0).length >= genCap(0)) return;
    const cap = capitalOf(0); if (!placeGen(g, cap.x, cap.y)) { toast('No room near the capital!'); return; }
    F.gold -= cost; const fav = CLASSES[g.cls].fav || 'infantry'; g.squads = [{ type: troopUnlocked(0, fav) ? fav : 'infantry', hp: 10 }]; g.mp = 0;
    G.gens.push(g); F.scout.splice(+b.dataset.hire, 1);
    toast(`${g.name} joins your cause!`); logMsg(`${g.name} (${g.cls}) hired`);
    closeModal(); centerOn(g.x, g.y); selectArmy(g);
  });
}
function techModal() {
  const F = G.factions[0];
  let h = `<h3>📜 Technology</h3><div class="sub">You have <b style="color:var(--gold)">${F.tp}</b> Tech Points. Earn more by raising your Kingdom level.</div>`;
  for (const br of ['Economy', 'Logistics', 'Military']) {
    h += `<h4>${br}</h4><div class="tech">`;
    for (const t of TECHS.filter(x => x.br === br)) {
      const have = F.techs.includes(t.id), reqOk = t.req.every(r => F.techs.includes(r)), can = !have && reqOk && F.tp >= t.c;
      h += `<div class="tc ${have ? 'have' : reqOk ? 'avail' : 'lock'}"><b>${t.n}</b>${t.d}<div class="row" style="margin-top:4px">${have ? '✔ Learned' : `<button class="btn sm" data-tech="${t.id}" ${can ? '' : 'disabled'}>Learn (${t.c} TP)</button>`}${t.req.length ? `<span class="sub">Needs ${t.req.map(r => TECH[r].n).join(', ')}</span>` : ''}</div></div>`;
    }
    h += `</div>`;
  }
  openModal(h);
  document.querySelectorAll('[data-tech]').forEach(b => b.onclick = () => { const t = TECH[b.dataset.tech]; if (F.tp < t.c) return; F.tp -= t.c; F.techs.push(t.id); toast(`Learned <b>${t.n}</b>!`); if (t.id === 'logistics') for (const g of fieldGens(0)) g.mp++; techModal(); renderHUD(); });
}
$('#bKingdom').onclick = () => !UI.busy && kingdomModal();
$('#bGenerals').onclick = () => !UI.busy && generalsModal();
$('#bTavern').onclick = () => !UI.busy && tavernModal();
$('#bTech').onclick = () => !UI.busy && techModal();
$('#bNext').onclick = () => !UI.busy && nextArmy();
$('#bEnd').onclick = () => endTurn();

// ============ TITLE / BOOT ============
let previewSeed = 0;
function rollPreview() {
  previewSeed = Math.floor(Math.random() * 1e6);
  RNG = Math.random;
  const w = genWorld(previewSeed);
  newGame(w, $('#kname').value || 'Kingdom of Aster');
  const cap = capitalOf(0); cam.z = (innerWidth < 760 || innerHeight <= 520) ? 1 : 1.5; centerOn(cap.x, cap.y);
  $('#tSeed').textContent = `Map #${previewSeed} · ${G.cities.length} cities · 4 kingdoms`;
}
function startUI() {
  $('#title').style.display = 'none';
  for (const id of ['#hud', '#toolbar']) $(id).style.display = 'flex';
  $('#zoom').style.display = 'flex'; $('#log').style.display = 'block';
  renderHUD(); renderLog();
  const g = fieldGens(0)[0]; if (g) { centerOn(g.x, g.y); selectArmy(g); }
}
$('#tReroll').onclick = rollPreview;
$('#tStart').onclick = () => {
  G.factions[0].name = ($('#kname').value || 'Kingdom of Aster').slice(0, 24);
  logMsg('The conquest begins.'); saveGame(); startUI();
  toast('Select your General, move across the map, and attack red-highlighted foes. Capture Free Towns to grow!', 6000);
};
$('#tCont').onclick = () => { if (loadGame()) { cam.z = (innerWidth < 760 || innerHeight <= 520) ? 1 : 1.5; startUI(); } else toast('Save could not be loaded.'); };
try { if (localStorage.getItem(SAVE_KEY)) $('#tCont').style.display = ''; } catch (e) { }
atlasReady.then(rollPreview);
</script>
</body></html>
